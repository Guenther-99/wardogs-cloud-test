name: WARDOGS V6 Steam Probe (anonymous read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  steam_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
      - name: Probe 8 Steam profiles without logging in
        run: python cloud/steam_anonymous_probe.py
      - name: Upload report (no session data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wardogs-steam-anonymous-probe
          path: steam_anonymous_probe_result.json
          if-no-files-found: ignore
          retention-days: 2
