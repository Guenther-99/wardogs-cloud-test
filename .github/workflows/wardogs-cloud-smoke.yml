name: WARDOGS V6 Cloud Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wardogs-cloud-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out safe test scripts
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run read-only cloud checks
        env:
          WARDOGS_PUBLIC_PAGE: https://guenther-99.github.io/wardogs-join/server.html
          WARDOGS_STEAM_PUBLIC_PROFILE: https://steamcommunity.com/profiles/76561199685613122/
        run: python cloud/smoke_test.py
